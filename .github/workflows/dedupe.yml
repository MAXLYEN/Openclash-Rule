name: Dedupe rules

# 为什么不挂在 push 上：
# 一条规则是否冗余，取决于它在 Openclash-Config 的 ini 里排第几位 ——
# 判定依赖的是**另一个仓库**的内容。挂在 push 上会出现"刚加的规则在同一次提交里
# 被自己停用"这种莫名其妙的情况。所以只在手动触发、或配置仓库通知时跑。
#
# scripts/dedupe.py 是可逆的：已停用但不再冗余的行会被自动恢复，
# 所以重复运行安全，不会形成单向棘轮。
on:
  workflow_dispatch:
    inputs:
      apply:
        description: '写入改动（不勾选则只出报告）'
        type: boolean
        default: false
  # 由 Openclash-Config 在 dist/Custom_Clash_V2.ini 变化后通知本仓库重新评估（只出报告）。
  # 发送方需要在 Openclash-Config 的 Actions secrets 里配置 RULE_DISPATCH_TOKEN：
  # fine-grained PAT，仓库范围 MAXLYEN/Openclash-Rule，权限 Contents: Read and write。
  repository_dispatch:
    types: [config-updated]

permissions:
  contents: write

concurrency:
  group: dedupe
  cancel-in-progress: true

jobs:
  dedupe:
    # 固定版本：ubuntu-latest 自 2026-10-19 起迁移到 Ubuntu 26，避免运行环境悄悄变化
    runs-on: ubuntu-24.04
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install --quiet pyyaml

      - name: 冗余分析
        env:
          # 由 Openclash-Config 通知时带着它**含产物的**提交号，按提交号读取，
          # 避开 raw.githubusercontent.com 对 main 分支约 5 分钟的缓存
          CONFIG_SHA: ${{ github.event.client_payload.sha }}
        run: |
          INI_ARG=""
          if [ -n "$CONFIG_SHA" ]; then
            INI_ARG="--ini https://raw.githubusercontent.com/MAXLYEN/Openclash-Config/${CONFIG_SHA}/dist/Custom_Clash_V2.ini"
          fi
          python3 scripts/dedupe.py $INI_ARG | tee /tmp/report.txt
          {
            echo '## 冗余分析报告'
            echo '```'
            cat /tmp/report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 有待处理项时打告警标注，否则只躺在 Summary 里没人看
          if grep -q '【需恢复】' /tmp/report.txt || ! grep -q 'A+B 可安全停用】共 0 条' /tmp/report.txt; then
            echo "::warning::规则链变化后有冗余规则待停用 / 恢复，见本次运行的 Summary；需手动以 apply 模式重跑本 workflow"
          fi
          if grep -q 'ini 引用但 rules/list 里不存在' /tmp/report.txt; then
            echo "::warning::配置引用了规则库中不存在的规则集，见 Summary"
          fi

      # repository_dispatch 触发时默认只报告，避免配置仓库一改就自动改规则
      - name: 应用改动
        if: inputs.apply
        run: |
          python3 scripts/dedupe.py --apply
          python3 scripts/build.py
          python3 scripts/validate.py

      - name: 提交
        if: inputs.apply
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          COUNT=$(git diff --cached --name-only | wc -l)
          # 本 workflow 只在手动触发时提交，yaml 的变化全部来自这次 bot 提交，看暂存区即可
          git diff --cached --name-only -- 'rules/yaml/*.yaml' > /tmp/changed.txt
          git commit -m "chore: 冗余规则停用/恢复（${COUNT} 个文件）"
          PUSHED=0
          for i in 1 2 3; do
            if git push; then PUSHED=1; break; fi
            echo "推送被拒，rebase 后重试（第 ${i} 次）"
            git pull --rebase origin main || { git rebase --abort; break; }
          done
          [ "$PUSHED" = 1 ] || exit 1
          # 推送成功才记录；中途 rebase 过的话 HEAD 已是 rebase 后的提交
          git rev-parse HEAD > /tmp/rule_sha

      # 以下两步与 build.yml 的同名步骤作用相同。必须在这里补做：本 workflow 用
      # GITHUB_TOKEN 推送，GitHub 不会因此触发 build.yml，推送后既不刷新 jsdelivr 缓存，
      # 也不通知 Openclash-Config 校验。而停用冗余规则恰恰可能把某个规则集清空，
      # 正是 Openclash-Config 的 --strict-empty 要抓的情况，不通知就只能等它每周一的定时校验。
      # 不会循环：对方收到 rules-updated 只做校验，产物 V2 变化时回发的 config-updated
      # 以 repository_dispatch 触发本 workflow，此时 inputs.apply 为空，只出报告。
      - name: 刷新 jsdelivr 缓存
        if: always() && inputs.apply
        continue-on-error: true
        run: |
          [ -f /tmp/rule_sha ] || { echo "未推送，跳过"; exit 0; }
          [ -s /tmp/changed.txt ] || { echo "无 yaml 变动，跳过"; exit 0; }
          n=0
          while read -r f; do
            name=$(basename "$f")
            code=$(curl -s -o /dev/null -w '%{http_code}' \
                   "https://purge.jsdelivr.net/gh/MAXLYEN/Openclash-Rule@main/rules/yaml/$name")
            echo "  $name -> HTTP $code"
            n=$((n+1))
            sleep 0.3
          done < /tmp/changed.txt
          echo "已请求刷新 $n 个文件"

      - name: 通知 Openclash-Config 校验引用
        # 密钥与 build.yml 共用 DISPATCH_TOKEN（仓库范围 MAXLYEN/Openclash-Config，
        # 权限 Contents: Read and write）
        if: always() && inputs.apply
        continue-on-error: true
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          [ -f /tmp/rule_sha ] || { echo "未推送，无需通知"; exit 0; }
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "未配置 DISPATCH_TOKEN，跳过通知"
            exit 0
          fi
          SHA=$(cat /tmp/rule_sha)
          echo "通知提交 ${SHA}"
          curl -sS -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/MAXLYEN/Openclash-Config/dispatches \
            -d "{\"event_type\":\"rules-updated\",\"client_payload\":{\"sha\":\"${SHA}\"}}"
