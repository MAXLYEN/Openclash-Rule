name: Build rulesets

# 仅在手动维护的 rules/list/ 变化时触发。
# 产物提交到 rules/yaml/，该路径不在触发范围内，不会循环触发。
on:
  push:
    branches: [main]
    paths:
      - 'rules/list/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:        # 支持手动运行，用于首次生成或强制重建

permissions:
  contents: write

concurrency:                # 连续推送时只保留最后一次构建
  group: build-rulesets
  cancel-in-progress: true

jobs:
  build:
    # 固定版本：ubuntu-latest 自 2026-10-19 起迁移到 Ubuntu 26，避免运行环境悄悄变化
    runs-on: ubuntu-24.04
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install --quiet pyyaml

      - name: 规范化 list 并生成 yaml
        run: python3 scripts/build.py

      - name: 校验产物
        run: python3 scripts/validate.py

      - name: 提交产物
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/list rules/yaml
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            echo "$GITHUB_SHA" > /tmp/rule_sha
            exit 0
          fi
          COUNT=$(git diff --cached --name-only | wc -l)
          git commit -m "chore: 重新生成规则产物（${COUNT} 个文件）" -m "来源提交 ${GITHUB_SHA::7}"
          # 构建期间 main 可能被推进（只改 README / docs 的推送不触发本 workflow，
          # 不受 concurrency 保护），直接 push 会被拒。先 rebase 再重试；
          # rebase 冲突时中止，交给下一次构建，避免把半截状态推上去。
          PUSHED=0
          for i in 1 2 3; do
            if git push; then PUSHED=1; break; fi
            echo "推送被拒，rebase 后重试（第 ${i} 次）"
            git pull --rebase origin main || { git rebase --abort; break; }
          done
          [ "$PUSHED" = 1 ] || exit 1
          # 通知 Openclash-Config 时要带上**含产物的**提交号：yaml 生成在本步的 bot 提交里，
          # 源提交 GITHUB_SHA 上的 rules/yaml 还是旧的
          git rev-parse HEAD > /tmp/rule_sha

      - name: 刷新 jsdelivr 缓存
        # 规则产物走 rule-provider，客户端的更新延迟 = jsdelivr CDN 缓存 + provider interval
        # 两层叠加。这一步把 CDN 那层消掉，剩下的就只有 interval。
        # 必须排在 git push 之后：purge 会让 jsdelivr 立即回源，推送之前回源拿到的还是旧内容。
        #
        # 刷新哪些文件，看的是「本次运行前后远端 main 上哪些 rules/yaml 变了」，
        # 而不是 bot 自己的提交：在本地跑过 build.py、把 yaml 一起推上来时，bot 无可提交，
        # 只看 bot 提交会一个都不刷（例如 b57c37a 改了 5 个 yaml，CI 打印「无 yaml 变动」）。
        # 基准 BASE：push 用推送前的远端 tip（event.before）；手动运行用 GITHUB_SHA，
        # 此时只有 bot 提交可能改变 yaml。/tmp/rule_sha 存在即表示本地 HEAD 已在远端。
        if: always()
        continue-on-error: true
        env:
          EVENT_BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          [ -f /tmp/rule_sha ] || { echo "产物未推送到远端，跳过"; exit 0; }
          if [ "$GITHUB_EVENT_NAME" = push ]; then BASE="$EVENT_BEFORE"; else BASE="$GITHUB_SHA"; fi
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ]; then
            # checkout 是浅克隆，event.before 通常不在本地；diff 只需两端的树，单独取回即可
            git cat-file -e "$BASE^{commit}" 2>/dev/null \
              || git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null || true
          fi
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE" HEAD -- 'rules/yaml/*.yaml' > /tmp/changed.txt
            echo "相对 ${BASE::7} 变化 $(wc -l < /tmp/changed.txt) 个 yaml"
          else
            # 无基准（新分支）或取不到（被强推覆盖后已不可达）：全部刷新
            ls rules/yaml/*.yaml > /tmp/changed.txt
            echo "基准 ${BASE:-（无）} 不可用，全部刷新"
          fi
          [ -s /tmp/changed.txt ] || { echo "无 yaml 变动，跳过"; exit 0; }
          n=0
          while read -r f; do
            name=$(basename "$f")
            code=$(curl -s -o /dev/null -w '%{http_code}' \
                   "https://purge.jsdelivr.net/gh/MAXLYEN/Openclash-Rule@main/rules/yaml/$name")
            echo "  $name -> HTTP $code"
            n=$((n+1))
            sleep 0.3
          done < /tmp/changed.txt
          echo "已请求刷新 $n 个文件"

      - name: 通知 Openclash-Config 校验引用
        # 本仓库改文件名或目录结构时，Openclash-Config 的 ini 会静默断链
        # （Clash_Sub_Store.ini 的 74 条 URL 全部 404 就是这么来的）。
        # 构建完成后主动通知对方跑一次联网校验，几分钟内暴露而不是几个月后。
        #
        # 需要在本仓库 Settings → Secrets and variables → Actions 添加 DISPATCH_TOKEN：
        # 一个 fine-grained PAT，仓库范围选 MAXLYEN/Openclash-Config，
        # 权限 Contents: Read and write。GITHUB_TOKEN 无法跨仓库触发 workflow。
        if: always()
        continue-on-error: true
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "未配置 DISPATCH_TOKEN，跳过通知"
            exit 0
          fi
          # 推送失败时没有 /tmp/rule_sha，退回源提交（此时线上产物也确实停在旧版本）
          SHA=$(cat /tmp/rule_sha 2>/dev/null || echo "$GITHUB_SHA")
          echo "通知提交 ${SHA}"
          curl -sS -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/MAXLYEN/Openclash-Config/dispatches \
            -d "{\"event_type\":\"rules-updated\",\"client_payload\":{\"sha\":\"${SHA}\"}}"
